<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>NEON HAND FIELD</title>
  <style>
    html,body{margin:0;height:100%;background:#05060a;color:#cfe8ff;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
    #c{position:fixed;inset:0;width:100%;height:100%;display:block}
    #hud{position:fixed;left:12px;top:10px;right:12px;display:flex;gap:10px;align-items:center;z-index:9}
    #title{font-weight:700;letter-spacing:.08em;opacity:.9}
    #tip{margin-left:auto;opacity:.85;font-size:12px}
    #log{position:fixed;left:12px;bottom:12px;right:12px;z-index:9;
      background:rgba(0,0,0,.45);border:1px solid rgba(120,200,255,.18);
      border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.35;
      backdrop-filter: blur(10px);
      white-space:pre-wrap;
    }
    #btn{
      position:fixed;left:12px;bottom:84px;z-index:10;
      padding:12px 14px;border-radius:18px;border:1px solid rgba(120,200,255,.25);
      background:rgba(0,0,0,.35);color:#d9f2ff;font-weight:700;
    }
    #btn:active{transform:scale(.98)}
    #v{position:fixed;right:10px;bottom:10px;width:140px;aspect-ratio:3/4;
      border-radius:14px;overflow:hidden;opacity:.15;border:1px solid rgba(120,200,255,.2);
      z-index:8;display:none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="title">NEON HAND FIELD</div>
    <div id="tip">拇指+食指捏合=聚拢｜张开=扩散（需要摄像头权限）</div>
  </div>

  <button id="btn">启动摄像头 + 手势</button>
  <div id="log">准备中…</div>
  <video id="v" playsinline autoplay muted></video>

  <script type="module">
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: true });
    const btn = document.getElementById('btn');
    const logBox = document.getElementById('log');
    const video = document.getElementById('v');

    function log(s){ logBox.textContent = s; }

    // 适配屏幕
    function resize(){
      const dpr = Math.max(1, Math.min(2.5, devicePixelRatio || 1));
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    addEventListener('resize', resize, {passive:true});
    resize();

    // ------- 粒子系统（酷炫/未来感：霓虹拖尾 + 扰动 + 吸引/排斥场） -------
    const N = 5200;
    const P = new Array(N).fill(0).map(()=>({
      x: Math.random()*innerWidth,
      y: Math.random()*innerHeight,
      vx: 0, vy: 0,
      hue: 180 + Math.random()*120,
      a: 0.6 + Math.random()*0.4
    }));

    let targetX = innerWidth*0.5, targetY = innerHeight*0.55;
    let field = 0.35;      // 0=强聚拢  1=强扩散
    let energy = 0.8;      // “未来感”动能
    let lastT = performance.now();

    function step(t){
      const dt = Math.min(0.033, (t-lastT)/1000); lastT=t;

      // 背景拖尾（更赛博）
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(2,3,8,${0.20})`;
      ctx.fillRect(0,0,innerWidth,innerHeight);

      ctx.globalCompositeOperation = 'lighter';

      const fx = (x,y)=> {
        const dx = targetX - x, dy = targetY - y;
        const r2 = dx*dx + dy*dy + 80;
        const inv = 1/Math.sqrt(r2);

        // field：捏合->吸引更强；张开->排斥更强
        const attract = (1-field)* 1600;
        const repel   = field * 900;

        // 吸引/排斥混合 + 环形扭曲
        const ax = dx*inv*attract - dx*inv*repel;
        const ay = dy*inv*attract - dy*inv*repel;

        // 旋涡（更未来感）
        const swirl = (0.45 + energy*0.9) * 520;
        const sx = -dy*inv*swirl;
        const sy =  dx*inv*swirl;

        return [ax+sx, ay+sy];
      };

      for (let i=0;i<N;i++){
        const p=P[i];
        const [ax,ay]=fx(p.x,p.y);

        // 阻尼 + 随机微扰
        p.vx = p.vx*0.90 + ax*dt*0.0012 + (Math.random()-0.5)*energy*0.12;
        p.vy = p.vy*0.90 + ay*dt*0.0012 + (Math.random()-0.5)*energy*0.12;

        p.x += p.vx;
        p.y += p.vy;

        // 边界回弹
        if(p.x<0||p.x>innerWidth){p.vx*=-0.8; p.x=Math.max(0,Math.min(innerWidth,p.x));}
        if(p.y<0||p.y>innerHeight){p.vy*=-0.8; p.y=Math.max(0,Math.min(innerHeight,p.y));}

        // 画点（霓虹）
        const alpha = p.a * (0.55 + energy*0.45);
        ctx.fillStyle = `hsla(${p.hue},100%,65%,${alpha})`;
        ctx.fillRect(p.x, p.y, 1.2, 1.2);
      }

      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    // ------- 关键：多源加载 MediaPipe（解决 unpkg 失败） -------
    async function tryImport(url){
      try{
        const m = await import(url);
        return m;
      }catch(e){
        return null;
      }
    }

    async function loadVisionModule(){
      const candidates = [
        // 1) jsDelivr（通常比 unpkg 更稳）
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15/vision_bundle.mjs",
        // 2) esm.sh 备用
        "https://esm.sh/@mediapipe/tasks-vision@0.10.15?bundle",
        // 3) GitHub Raw 镜像（当 CDN 全挂/被墙时）
        "https://raw.githubusercontent.com/whatisor/mediapipe-tasks-vision/master/vision_bundle.mjs"
      ];

      for (const url of candidates){
        log("正在加载 MediaPipe 模块：\n" + url);
        const m = await tryImport(url);
        if(m){
          log("✅ MediaPipe 模块加载成功：\n" + url);
          return m;
        }
      }
      throw new Error("MediaPipe 脚本加载失败（所有源都失败）");
    }

    async function pickWasmBase(FilesetResolver){
      const bases = [
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15/wasm",
        "https://raw.githubusercontent.com/whatisor/mediapipe-tasks-vision/master/wasm"
      ];
      for (const base of bases){
        try{
          log("正在加载 WASM Fileset：\n" + base);
          const vision = await FilesetResolver.forVisionTasks(base);
          log("✅ WASM Fileset 成功：\n" + base);
          return vision;
        }catch(e){}
      }
      throw new Error("WASM 文件加载失败（所有源都失败）");
    }

    // ------- 摄像头 + 手势（捏合控制聚拢/扩散） -------
    let running = false;

    async function start(){
      if(running) return;
      running = true;

      try{
        // 1) 摄像头
        log("请求摄像头权限中…（弹窗请选择允许）");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // 2) 载入 MediaPipe
        const mp = await loadVisionModule();
        const { GestureRecognizer, FilesetResolver } = mp;

        // 3) 选择 WASM 源
        const vision = await pickWasmBase(FilesetResolver);

        // 4) 创建识别器（模型从 Google 存储拉取；如果你网络挡住它，我再教你“把模型放进仓库”）
        const modelUrl =
          "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";

        log("正在加载手势模型…\n" + modelUrl);
        const recognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelUrl },
          runningMode: "VIDEO",
          numHands: 1
        });
        log("✅ 手势识别器已就绪！把手放到镜头里，拇指+食指捏合试试。");

        // 5) 实时识别循环
        let lastVideoTime = -1;
        const smooth = (a,b,k)=>a+(b-a)*k;
        let pinchSmoothed = 0.35;

        function loop(){
          if(video.readyState >= 2){
            if(video.currentTime !== lastVideoTime){
              lastVideoTime = video.currentTime;
              const res = recognizer.recognizeForVideo(video, performance.now());

              // res.landmarks: 手部 21 点（如果识别到手）
              const lm = res?.landmarks?.[0];
              if(lm){
                // 4=拇指尖, 8=食指尖
                const dx = (lm[4].x - lm[8].x);
                const dy = (lm[4].y - lm[8].y);
                const pinch = Math.min(1, Math.max(0, Math.sqrt(dx*dx+dy*dy) / 0.35)); // 0=捏合 1=张开
                pinchSmoothed = smooth(pinchSmoothed, pinch, 0.15);

                field = pinchSmoothed;               // 捏合=>0 聚拢；张开=>1 扩散
                energy = 0.6 + (1-pinchSmoothed)*0.7; // 捏合时更“能量爆棚”

                // 让场中心跟随手掌中心（更像“隔空控场”）
                const palm = lm[0]; // wrist
                targetX = smooth(targetX, palm.x * innerWidth, 0.22);
                targetY = smooth(targetY, palm.y * innerHeight, 0.22);
              }
            }
          }
          requestAnimationFrame(loop);
        }
        loop();

      }catch(err){
        running = false;
        console.error(err);
        log("启动失败 ❌\n" + (err?.message || err));
        alert("启动失败：\n" + (err?.message || err));
      }
    }

    btn.addEventListener('click', start);
  </script>
</body>
</html>
